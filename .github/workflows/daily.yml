name: 덱 데이터 갱신

on:
  schedule:
    # 매일 UTC 20:00 = KST 05:00. 한국 새벽에 갱신해 아침에는 최신이 되도록.
    - cron: "0 20 * * *"
  workflow_dispatch:        # 수동 실행 (패치 직후 등)

permissions:
  contents: write
  issues: write             # 실패 시 이슈 등록

concurrency:
  group: deck-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 덱(상세 호출 ~100회 + metatft 클러스터 상세) + 도감(~220회) + 아이콘 팩
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 덱 수집기는 표준 라이브러리만 쓴다. 이 두 단계가 실패하면 아무것도 커밋하지 않는다.
      - name: 덱 수집
        run: python collector/fetch_decks.py

      - name: 덱 검증
        run: python collector/verify.py

      # 도감·아이콘은 덱과 독립이라, 실패해도 덱 갱신은 막지 않고 이슈로만 알린다.
      # 스크립트가 아직 저장소에 없으면 건너뛴다.
      - name: 도감 통계 수집
        id: stats
        continue-on-error: true
        run: |
          if [ -f collector/fetch_stats.py ]; then
            python collector/fetch_stats.py
          else
            echo "collector/fetch_stats.py 없음 — 건너뜀"
          fi

      - name: 도감 통계 검증
        id: stats_verify
        continue-on-error: true
        run: |
          if [ ! -f collector/verify_stats.py ]; then
            echo "collector/verify_stats.py 없음 — 건너뜀"
            exit 0
          fi
          if ! python collector/verify_stats.py; then
            # 검증을 통과하지 못한 도감은 커밋하지 않는다: 추적 파일은 되돌리고 새 파일은 지운다.
            git checkout -- data/stats 2>/dev/null || true
            git clean -fdq -- data/stats || true
            exit 1
          fi

      - name: 아이콘 팩
        id: icons
        continue-on-error: true
        run: |
          if [ -f collector/build_icons.py ]; then
            pip install pillow
            python collector/build_icons.py
          else
            echo "collector/build_icons.py 없음 — 건너뜀"
          fi

      - name: 변경분 커밋
        run: |
          git add data/
          # 먼저 스테이징한 뒤 비교해야 새로 생긴 파일(data/stats, data/icons, data/flags.json)도 잡힌다.
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "tft-deck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PATCH=$(python -c "import json;print(json.load(open('data/version.json'))['patch'])")
          COUNT=$(python -c "import json;print(json.load(open('data/version.json'))['deckCount'])")
          STATS="유지"
          git diff --cached --quiet -- data/stats data/flags.json || STATS="갱신"
          ICONS="유지"
          git diff --cached --quiet -- data/icons || ICONS="갱신"
          git commit -m "덱 데이터 갱신: 패치 ${PATCH}, ${COUNT}개 덱 · 도감 ${STATS} · 아이콘 ${ICONS}"
          git push

      # 원본 스키마가 바뀌면 조용히 낡은 데이터를 쓰게 되므로 실패를 드러낸다.
      # continue-on-error 단계의 실패는 failure() 에 잡히지 않아 outcome 을 따로 본다.
      - name: 실패 시 이슈 등록
        if: failure() || steps.stats.outcome == 'failure' || steps.stats_verify.outcome == 'failure' || steps.icons.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          STATS_OUTCOME: ${{ steps.stats.outcome }}
          STATS_VERIFY_OUTCOME: ${{ steps.stats_verify.outcome }}
          ICONS_OUTCOME: ${{ steps.icons.outcome }}
        with:
          script: |
            const failed = [];
            if (process.env.JOB_STATUS === "failure") failed.push("덱 수집·검증·커밋");
            if (process.env.STATS_OUTCOME === "failure") failed.push("도감 통계 수집");
            if (process.env.STATS_VERIFY_OUTCOME === "failure") failed.push("도감 통계 검증(도감 파일은 되돌림)");
            if (process.env.ICONS_OUTCOME === "failure") failed.push("아이콘 팩");
            const title = "덱 수집 실패";
            const body = [
              "매일 수집이 실패했습니다. 앱은 직전 데이터를 계속 사용합니다.",
              "",
              `실패한 단계: ${failed.join(", ") || "알 수 없음"}`,
              "",
              `실행 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "흔한 원인:",
              "- 시즌 전환으로 lol.qq의 lineupJson 경로나 versionconfig 가 바뀜",
              "- lol.qq 통계 프록시가 HTTP 200 빈 응답을 줌 (req_alias·time_type 변경)",
              "- metatft 스키마 변경 (`cluster_info.cluster_details.clusters`, `comps_stats`)",
              "- CommunityDragon 최신 반영 지연",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "collector",
            });
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["collector"],
              });
            }
